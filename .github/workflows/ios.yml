name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies & Build Web App
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Add & Sync Capacitor iOS
      run: |
        npm install --legacy-peer-deps @capacitor/ios
        npx cap add ios || true
        npx cap sync ios

    - name: Build Xcode Archive (Unsigned)
      working-directory: ./ios/App
      run: |
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/App.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS=""

    - name: Package into IPA
      run: |
        mkdir -p "$RUNNER_TEMP/Payload"
        cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP"
        zip -r -q agamakizh-ias-academy-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: agamakizh-ias-academy-ios.ipa
        path: ${{ runner.temp }}/agamakizh-ias-academy-unsigned.ipa
        retention-days: 14
