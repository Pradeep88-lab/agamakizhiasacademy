name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies & Build Web App
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Add & Sync Capacitor iOS
      run: |
        npm install --legacy-peer-deps @capacitor/ios
        npx cap add ios || true
        npx cap sync ios

    - name: Build Xcode Project (Unsigned)
      working-directory: ./ios/App
      run: |
        if [ -d "App.xcworkspace" ]; then
          PROJECT_FLAG="-workspace App.xcworkspace"
        else
          PROJECT_FLAG="-project App.xcodeproj"
        fi

        xcodebuild build \
          $PROJECT_FLAG \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Package into IPA
      run: |
        APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -type d | head -n 1)
        echo "Found App bundle at: $APP_PATH"
        mkdir -p "$RUNNER_TEMP/Payload"
        cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
        cd "$RUNNER_TEMP"
        zip -r -q agamakizh-ias-academy-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: agamakizh-ias-academy-ios.ipa
        path: ${{ runner.temp }}/agamakizh-ias-academy-unsigned.ipa
        retention-days: 14
