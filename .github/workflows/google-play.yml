name: Release Agamakizh IAS Academy

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies & Build Web
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android || true

      - name: Make Gradle executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK and Release AAB
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug bundleRelease
          else
            ./gradlew assembleDebug bundleRelease
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Create GitHub Release (Free APK Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      - name: Upload to Google Play (Internal Track)
        if: "${{ secrets.SERVICE_ACCOUNT_JSON != '' }}"
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.agamakizh.ias
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
