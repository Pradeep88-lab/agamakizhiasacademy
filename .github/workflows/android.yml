name: Build Android AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Create signing keystore
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

          if [ ! -f upload-keystore.jks ]; then
            echo "ERROR: Keystore was not created"
            exit 1
          fi

          echo "Keystore created successfully"

      - name: Create key.properties
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Check AAB
        run: |
          ls -lh build/app/outputs/bundle/release/

          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "ERROR: app-release.aab was not created"
            exit 1
          fi

          echo "AAB created successfully"

      - name: Sign AAB
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            ../build/app/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"

      - name: Verify AAB signature
        working-directory: ./android
        run: |
          jarsigner \
            -verify \
            -verbose \
            -certs \
            ../build/app/outputs/bundle/release/app-release.aab

          echo "AAB signature verified successfully"

      - name: Prepare final AAB
        run: |
          mkdir -p release

          cp build/app/outputs/bundle/release/app-release.aab \
            release/Agamakizh-release.aab

          ls -lh release/Agamakizh-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agamakizh-Android-AAB
          path: release/Agamakizh-release.aab
          if-no-files-found: error

      - name: Clean signing files
        if: always()
        run: |
          rm -f android/upload-keystore.jks
          rm -f android/key.properties
