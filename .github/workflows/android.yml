name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web App
      run: npm run build

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Add & Sync Capacitor
      run: npx cap add android

    - name: Build APK (Debug)
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: agamakizh-ias-academy-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

  build-android-release:
    name: Build Release AAB (Play Store)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: { node-version: '22', cache: 'npm' }
    
    - name: Install dependencies & Build Web App
      run: |
        npm install --legacy-peer-deps
        npm run build
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '21' }
      
    - name: Add & Sync Capacitor
      run: npx cap add android

    - name: Build AAB (Release)
      working-directory: ./android
      run: |
        chmod +x ./gradlew
        ./gradlew bundleRelease
        
    - name: Sign AAB
      working-directory: ./android
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Sign the AAB manually using the committed keystore
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore ../upload-keystore.jks \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEY_PASSWORD" \
          app/build/outputs/bundle/release/app-release.aab \
          "$KEY_ALIAS"

    - name: Upload Release AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: agamakizh-ias-academy-release.aab
        path: android/app/build/outputs/bundle/release/app-release.aab
